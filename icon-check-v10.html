<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本北陸2026・圖示檢查</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#f3faed;color:#30533b;margin:0;padding:22px}main{max-width:560px;margin:auto;background:white;border-radius:22px;padding:22px}h1{font-size:22px}p{line-height:1.8}li{list-style:none;display:flex;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #e3ebdd}ul{padding:0}img{width:100px;height:100px;object-fit:contain;border-radius:20px;background:#f4f4f4}.result{font-weight:700;line-height:1.7}a{color:#386e46}</style><main><h1>App 圖示載入檢查</h1><p>應看到粉紅皮克敏坐飛機的圖示。這頁只檢查圖片，不讀取登入、護照或行程資料。</p><ul><li><img id="apple" src="./apple-touch-icon-v10.png" alt="iPhone 圖示"><span class="result" id="apple-status">正在載入 iPhone 圖示…</span></li><li><img id="app" src="./app-icon-512-v10.png" alt="App 圖示"><span class="result" id="app-status">正在載入 App 圖示…</span></li></ul><p>兩張都顯示正常後，使用 Safari 回到首頁，選「分享 → 加入主畫面」，確認預覽圖是皮克敏飛機再新增。先保留原本的圖示與私人備份。</p><p><a href="./">回到日本北陸2026</a></p></main><script>for(const [id,size]of[['apple',180],['app',512]]){const img=document.getElementById(id),out=document.getElementById(id+'-status');const ok=()=>{out.textContent=img.naturalWidth===size&&img.naturalHeight===size?'已讀取正確圖示（'+size+' × '+size+'）':'圖片尺寸不符，請重新上傳完整包'};const bad=()=>{out.textContent='圖片讀取失敗，請確認 PNG 檔案已放在儲存庫最外層'};img.addEventListener('load',ok);img.addEventListener('error',bad);if(img.complete){if(img.naturalWidth)ok();else bad()}}</script></html>
